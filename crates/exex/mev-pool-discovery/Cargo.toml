# Database
rocksdb = { version = "0.24", default-features = false, features = ["snappy"], optional = true }

# Collections
dashmap = "6.0"

# Tracing
tracing.workspace = true

[dev-dependencies]
reth-exex-test-utils.workspace = true
tempfile = "3"

[features]
default = []
rocksdb = ["dep:rocksdb"]

[lints]
workspace = true
